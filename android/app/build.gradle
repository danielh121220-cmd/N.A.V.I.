plugins {
    id "com.android.application"
}

android {
    namespace "ec.navi.app"
    compileSdk 34

    defaultConfig {
        applicationId "ec.navi.app"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "3.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
