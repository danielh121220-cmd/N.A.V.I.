plugins {
    id "com.android.application"
}

android {
    namespace "ec.navi.app"
    compileSdk 34

    defaultConfig {
        applicationId "ec.navi.app"
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName "3.10"
    }

    signingConfigs {
        prueba {
            storeFile file("navi-prueba.p12")
            storePassword "navi2026"
            keyAlias "navi"
            keyPassword "navi2026"
            storeType "pkcs12"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.prueba
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.prueba
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
