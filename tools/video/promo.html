<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/bots.css">
<style>
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
body { font-family: 'Inter Display', 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
.scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
.full { position: absolute; inset: 0; }
.ttl { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; letter-spacing: -0.045em; line-height: 1.02; white-space: nowrap; }
.ttl .w { display: inline-block; will-change: transform, opacity, filter; }
.sub { position: absolute; left: 0; right: 0; text-align: center; font-weight: 500; letter-spacing: -0.02em; white-space: nowrap; }
.white { color: #fff; } .bw { color: #fff; font-weight: 800; text-shadow: 0 6px 30px rgba(0,0,0,0.25); } .ink { color: #1d1d1f; } .gray { color: #86868b; }
.grad { background: linear-gradient(100deg, #36a3ff, #0a7cff 40%, #7b5cff); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 0.08em; }
.grad-warm { background: linear-gradient(100deg, #ffb340, #ff375f); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 0.08em; }
.photo { position: absolute; inset: -4%; background-size: cover; background-position: center; will-change: transform; }
.vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.55) 100%); }
.shade-b { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.72), rgba(0,0,0,0) 55%); }
.grain { position: absolute; inset: 0; opacity: 0.06; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

.reader { position: absolute; width: 440px; height: 620px; border-radius: 70px; background: linear-gradient(155deg, #ffffff 0%, #f1f2f5 45%, #dfe2e8 100%); box-shadow: inset 0 2px 1px rgba(255,255,255,0.9), inset 0 -6px 14px rgba(0,0,0,0.06), 0 60px 120px -30px rgba(0,0,0,0.55), 0 18px 40px -16px rgba(0,0,0,0.35); }
.reader .oled { position: absolute; left: 56px; top: 70px; width: 328px; height: 176px; border-radius: 22px; background: #050607; box-shadow: inset 0 0 0 2px #111, inset 0 6px 18px rgba(255,255,255,0.06); overflow: hidden; }
.reader .oled canvas { position: absolute; left: 20px; top: 16px; width: 288px; height: 144px; image-rendering: pixelated; }
.reader .oled::after { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,0.10), rgba(255,255,255,0) 40%); }
.reader .nfc { position: absolute; left: 50%; top: 318px; width: 150px; height: 150px; margin-left: -75px; }
.reader .nfc svg { width: 100%; height: 100%; }
.reader .leds { position: absolute; left: 0; right: 0; bottom: 62px; display: flex; justify-content: center; gap: 34px; }
.reader .leds i { width: 22px; height: 22px; border-radius: 50%; background: #c9ccd2; box-shadow: inset 0 2px 3px rgba(0,0,0,0.25); }
.reader .leds i.g.on { background: #34c759; box-shadow: 0 0 18px 6px rgba(52,199,89,0.75), 0 0 60px 18px rgba(52,199,89,0.35); }
.reader .brand { position: absolute; left: 0; right: 0; bottom: 112px; text-align: center; font: 600 22px 'Inter Display'; letter-spacing: 0.32em; color: #9aa0a8; }

.card { position: absolute; width: 360px; height: 228px; border-radius: 22px; background: linear-gradient(150deg, #ffffff, #eef1f6); box-shadow: 0 40px 80px -24px rgba(0,0,0,0.5), inset 0 1px 1px #fff; overflow: hidden; }
.card .ic { position: absolute; left: 26px; top: 24px; width: 54px; height: 54px; }
.card .wm { position: absolute; left: 92px; top: 36px; font: 700 26px 'Inter Display'; letter-spacing: -0.02em; color: #1d1d1f; }
.card .nm { position: absolute; left: 28px; bottom: 26px; font: 600 22px 'Inter Display'; color: #1d1d1f; }
.card .cd { position: absolute; left: 28px; bottom: 56px; font: 500 16px 'Inter Display'; color: #86868b; letter-spacing: 0.06em; }
.card .wv { position: absolute; right: 26px; top: 26px; width: 44px; height: 44px; opacity: 0.55; }
.card .stripe { position: absolute; right: -40px; bottom: -60px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(10,124,255,0.18), rgba(10,124,255,0)); }

.phone { position: absolute; width: 428px; height: 894px; border-radius: 68px; background: #0b0b0d; box-shadow: 0 0 0 2px #2a2a2e, 0 60px 120px -30px rgba(0,0,0,0.55), 0 20px 40px -20px rgba(0,0,0,0.4); }
.phone .scr { position: absolute; left: 14px; top: 14px; width: 400px; height: 866px; border-radius: 55px; overflow: hidden; background: #f2f2f7; }
.phone .scr .sb { position: absolute; left: 0; right: 0; top: 0; height: 46px; display: flex; justify-content: space-between; align-items: center; padding: 0 34px 0 40px; box-sizing: border-box; font: 600 17px 'Inter'; color: #000; z-index: 3; }
.phone .scr .sb .ic { display: flex; gap: 6px; align-items: center; }
.phone .scr img { position: absolute; left: 0; top: 46px; width: 400px; }
.phone .island { position: absolute; left: 50%; top: 24px; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: #000; z-index: 5; }
.phone .layer { position: absolute; inset: 0; }

.laptop { position: absolute; width: 1320px; }
.laptop .lid { position: relative; width: 1320px; height: 845px; border-radius: 30px 30px 10px 10px; background: #111214; box-shadow: 0 0 0 2px #2b2c30, 0 50px 120px -40px rgba(0,0,0,0.5); }
.laptop .lid .sc { position: absolute; left: 20px; top: 22px; width: 1280px; height: 800px; overflow: hidden; border-radius: 6px; background: #fff; }
.laptop .lid .sc img { width: 1280px; position: absolute; left: 0; top: 0; }
.laptop .base { position: relative; margin: 0 auto; width: 1480px; left: -80px; height: 26px; border-radius: 0 0 26px 26px; background: linear-gradient(#e3e4e8, #b9bcc3); box-shadow: 0 30px 60px -20px rgba(0,0,0,0.4); }
.laptop .base::before { content: ""; position: absolute; left: 50%; top: 0; width: 220px; height: 10px; margin-left: -110px; border-radius: 0 0 12px 12px; background: #c6c8ce; }

.lock { position: absolute; inset: 0; background: radial-gradient(120% 80% at 20% 10%, #ffb36b 0%, #ff6a88 35%, #6b5cff 75%, #2a2f8f 100%); }
.lock .time { position: absolute; left: 0; right: 0; top: 112px; text-align: center; font: 600 112px 'Inter Display'; letter-spacing: -0.04em; color: rgba(255,255,255,0.92); }
.lock .date { position: absolute; left: 0; right: 0; top: 92px; text-align: center; font: 600 22px 'Inter'; color: rgba(255,255,255,0.85); }
.lock .note { position: absolute; left: 14px; right: 14px; top: 300px; padding: 16px 16px 16px 16px; border-radius: 26px; background: rgba(255,255,255,0.62); backdrop-filter: blur(20px); display: flex; gap: 12px; align-items: flex-start; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.25); }
.lock .note .ni { width: 44px; height: 44px; flex: 0 0 44px; border-radius: 11px; overflow: hidden; }
.lock .note .nt { flex: 1; font: 500 17px 'Inter'; color: #111; line-height: 1.28; }
.lock .note .nt b { display: flex; justify-content: space-between; font-weight: 700; font-size: 16px; margin-bottom: 2px; }
.lock .note .nt b span { font-weight: 500; color: rgba(0,0,0,0.5); }

.mgrid { position: absolute; left: 50%; top: 360px; width: 1500px; margin-left: -750px; display: grid; grid-template-columns: repeat(10, 1fr); row-gap: 34px; justify-items: center; }
.mgrid > div { width: 104px; height: 104px; will-change: transform, opacity; }
.bokeh { position: absolute; border-radius: 50%; filter: blur(30px); }
.sun { position: absolute; border-radius: 50%; }
.lockbadge { position: absolute; width: 120px; height: 120px; border-radius: 34px; background: linear-gradient(150deg, #34c759, #0a9b4a); display: grid; place-items: center; box-shadow: 0 30px 60px -20px rgba(52,199,89,0.6); }
.flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 55%, rgba(120,255,160,0.55), rgba(52,199,89,0) 55%); opacity: 0; mix-blend-mode: screen; }
.hl { position: absolute; border-radius: 10px; box-shadow: 0 0 0 3px #0a7cff, 0 0 30px 6px rgba(10,124,255,0.35); opacity: 0; }
.pulse-dot { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #34c759; }
.foot { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font: 500 22px 'Inter Display'; color: #86868b; letter-spacing: -0.01em; }
</style>
